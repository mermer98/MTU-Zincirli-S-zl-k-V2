<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MTU Zincirli Sözlük{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('ana_sayfa') }}" class="nav-logo">
                <i class="fas fa-book"></i>
                <span>MTU Zincirli Sözlük</span>
            </a>
            <div class="nav-menu">
                <a href="{{ url_for('ana_sayfa') }}" class="nav-link"><i class="fas fa-home"></i> Ana Sayfa</a>
                <a href="{{ url_for('arama_sayfasi') }}" class="nav-link"><i class="fas fa-search"></i> Arama</a>
                <a href="{{ url_for('oyun') }}" class="nav-link"><i class="fas fa-gamepad"></i> Adam Asmaca</a>
                <a href="{{ url_for('tum_kelimeler') }}" class="nav-link"><i class="fas fa-list"></i> Tüm Kelimeler</a>
                <a href="{{ url_for('istatistikler_sayfasi') }}" class="nav-link"><i class="fas fa-chart-bar"></i> İstatistikler</a>
            </div>
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 MTU Zincirli Sözlük. Tüm hakları saklıdır.</p>
            <p>Türk Dil Kurumu verilerini kullanmaktadır.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
