<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTU Zincirli Sözlük V2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MTU Zincirli Sözlük V2</h1>
            <p class="subtitle">Kelimeler Arası Bağlantılı Sözlük Uygulaması</p>
        </header>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Kelime ara..." aria-label="Kelime ara">
            <button id="searchBtn" class="btn btn-primary">Ara</button>
            <button id="addBtn" class="btn btn-success">Yeni Kelime Ekle</button>
        </div>

        <div id="resultSection" class="result-section">
            <div id="wordDisplay" class="word-display"></div>
        </div>

        <!-- Modal for adding/editing words -->
        <div id="wordModal" class="modal">
            <div class="modal-content">
                <span class="close" aria-label="Kapat" role="button" tabindex="0">&times;</span>
                <h2 id="modalTitle">Yeni Kelime Ekle</h2>
                <form id="wordForm">
                    <div class="form-group">
                        <label for="wordInput">Kelime:</label>
                        <input type="text" id="wordInput" required>
                    </div>
                    <div class="form-group">
                        <label for="definitionInput">Tanım:</label>
                        <textarea id="definitionInput" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="exampleInput">Örnek Cümle:</label>
                        <textarea id="exampleInput" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="relatedWordsInput">İlişkili Kelimeler (virgülle ayırın):</label>
                        <input type="text" id="relatedWordsInput" placeholder="kelime1, kelime2, kelime3">
                    </div>
                    <div class="form-group">
                        <label for="categoryInput">Kategori:</label>
                        <input type="text" id="categoryInput" placeholder="isim, fiil, sıfat, vb.">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Kaydet</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary">İptal</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="stats-section">
            <p>Toplam Kelime: <span id="wordCount">0</span></p>
        </div>
    </div>

    <script src="dictionary-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
